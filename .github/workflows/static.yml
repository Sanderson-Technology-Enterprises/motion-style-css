# Static GitHub Pages deployment for the Motion Style CSS demo.
# No Jekyll or build framework is required.
name: Deploy Motion Studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'playground/**'
      - 'src/**'
      - '.github/actions/pages-deploy/**'
      - '.github/workflows/static.yml'
      - '.github/workflows/actions.lock'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://sanderson-technology-enterprises.github.io/motion-style-css/
    runs-on: ubuntu-latest
    steps:
      - name: Clone current main
        run: |
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" .

      - name: Prepare GitHub Pages artifact
        run: |
          tar \
            --dereference \
            --hard-dereference \
            --directory . \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload and deploy Motion Studio
        uses: ./.github/actions/pages-deploy
        env:
          GH_TOKEN: ${{ github.token }}
