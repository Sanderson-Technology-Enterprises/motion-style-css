# Static GitHub Pages deployment for the Motion Style CSS demo.
# No Jekyll or build step is required.
name: Deploy Motion Studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/static.yml'
      - '.github/workflows/actions.lock'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
