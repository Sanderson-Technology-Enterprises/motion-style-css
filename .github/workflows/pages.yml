name: Migrate demo to GitHub Actions Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Switch Pages build type to workflow
        run: |
          status="$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cat /tmp/pages-update.json || true
          echo
          if [ "${status}" != "204" ] && [ "${status}" != "200" ]; then
            echo "Pages migration failed with HTTP ${status}"
            exit 1
          fi
      - name: Verify Pages uses workflow builds
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            > /tmp/pages.json
          cat /tmp/pages.json
          python3 - <<'PY'
          import json
          with open('/tmp/pages.json') as handle:
              pages = json.load(handle)
          if pages.get('build_type') != 'workflow':
              raise SystemExit('Pages build_type is not workflow')
          PY
