name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/actions.lock'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Request legacy Pages rebuild
        run: |
          status="$(curl -sS -o /tmp/build.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
          cat /tmp/build.json
          echo
          if [ "${status}" != "201" ]; then
            echo "Pages rebuild request failed with HTTP ${status}"
            exit 1
          fi

      - name: Confirm Pages build completes
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))")"
            echo "Pages build status: ${status}"
            if [ "${status}" = "built" ]; then
              exit 0
            fi
            if [ "${status}" = "errored" ]; then
              exit 1
            fi
            sleep 5
          done
          echo "Pages build did not complete within the polling window."
          exit 1
