name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-actions.yml'
      - '.github/workflows/actions.lock'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write

concurrency:
  group: pages-router
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read Pages configuration
        id: pages
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            > /tmp/pages.json

          build_type="$(python3 -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type', 'unknown'))")"
          echo "GitHub Pages build type: ${build_type}"

          if [ "${build_type}" != "workflow" ]; then
            echo "::warning title=Pages source is still legacy::Change Settings > Pages > Source to GitHub Actions. This router remains green and will dispatch the real deployment after the source is changed."
            exit 0
          fi

          status="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-actions.yml/dispatches")"

          cat /tmp/dispatch.json || true
          echo
          if [ "${status}" != "204" ]; then
            echo "Could not dispatch the Pages deployment workflow; HTTP ${status}"
            exit 1
          fi

          echo "GitHub Actions Pages deployment dispatched."
