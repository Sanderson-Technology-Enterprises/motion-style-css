name: Verify Actions dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-actions-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository without external actions
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
      - name: Install official actions-lock extension
        run: gh extension install github/gh-actions-lock
      - name: Verify generated lockfile has no drift
        run: |
          cd repo
          gh actions-lock
          git diff --exit-code -- .github/workflows
      - name: Inspect legacy Pages builds
        run: |
          echo "-----BEGIN LATEST PAGES BUILD-----"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          echo
          echo "-----END LATEST PAGES BUILD-----"
          echo "-----BEGIN RECENT PAGES BUILDS-----"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds?per_page=10"
          echo
          echo "-----END RECENT PAGES BUILDS-----"
