name: Generate Actions dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-actions-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository without external actions
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
      - name: Install official actions-lock extension
        run: gh extension install github/gh-actions-lock
      - name: Generate dependency lockfile
        run: |
          cd repo
          gh actions-lock
          test -f .github/workflows/actions.lock
      - name: Print generated lockfile and workflow diff
        run: |
          cd repo
          echo "-----BEGIN ACTIONS LOCKFILE-----"
          cat .github/workflows/actions.lock
          echo "-----END ACTIONS LOCKFILE-----"
          echo "-----BEGIN ACTIONS WORKFLOW DIFF-----"
          git diff -- .github/workflows
          echo "-----END ACTIONS WORKFLOW DIFF-----"
      - name: Diagnose GitHub Pages configuration
        run: |
          echo "-----BEGIN PAGES API-----"
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          echo "HTTP ${status}"
          cat /tmp/pages.json
          echo
          echo "-----END PAGES API-----"
          echo "-----BEGIN LIVE PAGE-----"
          curl -fsSL "https://sanderson-technology-enterprises.github.io/motion-style-css/" | head -n 20
          echo "-----END LIVE PAGE-----"

# regenerate after SHA pinning and shell-only release workflow
