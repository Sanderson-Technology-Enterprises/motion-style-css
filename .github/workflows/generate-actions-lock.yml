name: Verify Actions dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository without external actions
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
      - name: Install official actions-lock extension
        run: gh extension install github/gh-actions-lock
      - name: Verify generated lockfile has no drift
        run: |
          cd repo
          gh actions-lock
          git diff --exit-code -- .github/workflows
