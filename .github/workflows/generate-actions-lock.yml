name: Generate Actions dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-actions-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository without external actions
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
      - name: Install official actions-lock extension
        run: |
          gh extension install github/gh-actions-lock
      - name: Generate dependency lockfile
        run: |
          cd repo
          gh actions-lock
          test -f .github/workflows/actions.lock
      - name: Commit generated lockfile
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/actions.lock
          if git diff --cached --quiet; then
            echo "Actions lockfile is already current."
            exit 0
          fi
          git commit -m "ci: generate Actions dependency lockfile"
          git push origin HEAD:main
