name: Verify Actions dependency lockfile

on:
  push:
    branches:
      - Demo-deployment-patch
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone PR branch without external actions
        run: |
          git clone --branch Demo-deployment-patch "https://github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Install official actions-lock extension
        run: gh extension install github/gh-actions-lock
      - name: Verify generated lockfile has no drift
        run: |
          cd repo
          gh actions-lock
          git diff --exit-code -- .github/workflows
      - name: Run repository release gate
        run: |
          cd repo
          npm ci --ignore-scripts
          npm run check
