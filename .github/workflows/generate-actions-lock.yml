name: Verify Actions dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-actions-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone current main
        run: |
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Install official actions-lock extension
        run: gh extension install github/gh-actions-lock
      - name: Verify Actions lockfile has no drift
        run: |
          cd repo
          gh actions-lock
          git diff --exit-code -- .github/workflows
      - name: Run final repository release gate
        run: |
          cd repo
          npm ci --ignore-scripts
          npm run check
