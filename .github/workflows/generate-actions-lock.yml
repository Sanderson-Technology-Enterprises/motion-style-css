name: Verify Actions dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-actions-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect GitHub Pages mode
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            > /tmp/pages.json
          cat /tmp/pages.json
          echo
          python3 - <<'PY'
          import json
          with open('/tmp/pages.json') as f:
              data=json.load(f)
          print("BUILD_TYPE="+str(data.get("build_type")))
          print("SOURCE="+str(data.get("source")))
          PY
