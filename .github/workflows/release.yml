name: Publish release package

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/actions.lock"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the package version from package.json to npm"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Static and package validation
        run: npm run check
      - name: Server tests
        run: npm run test:server
      - name: CSS tests
        run: npm run test:css
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npm run test:browser

  publish-npm:
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_npm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.15.0
      - name: Configure npm token fallback when available
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
      - name: Refuse to republish an existing immutable version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; refusing to republish."
            exit 1
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag latest
