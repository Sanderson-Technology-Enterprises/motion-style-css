name: Publish release package

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/actions.lock"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the package version from package.json to npm"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-publish:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_npm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install Node.js 22.14.0 without external actions
        run: |
          curl -fsSLo node.tar.xz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
          mkdir -p "${RUNNER_TEMP}/node22"
          tar -xJf node.tar.xz -C "${RUNNER_TEMP}/node22" --strip-components=1
          echo "${RUNNER_TEMP}/node22/bin" >> "${GITHUB_PATH}"

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: repo
        run: npm ci --ignore-scripts

      - name: Validate static package contracts
        working-directory: repo
        run: npm run check

      - name: Run server and CSS tests
        working-directory: repo
        run: |
          npm run test:server
          npm run test:css

      - name: Install Playwright browsers
        working-directory: repo
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser validation
        working-directory: repo
        run: npm run test:browser

      - name: Install npm trusted-publishing client
        run: npm install --global npm@11.15.0

      - name: Refuse to republish an immutable version
        working-directory: repo
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; refusing to republish."
            exit 1
          fi

      - name: Publish to npm with OIDC provenance
        working-directory: repo
        run: npm publish --access public --provenance --tag latest
